name: devicesocket

services:
  gateway:
    # 通过 .env 切换本地加载、私有仓库或版本化镜像，生产环境不要长期使用浮动 latest。
    image: "${DEVICE_SOCKET_IMAGE:-devicesocket-host:1.0.0}"
    container_name: devicesocket-host

    # Linux host 网络绕过 Docker bridge NAT；端口直接使用应用的 5001、5002、5080 和 7001。
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

    # 8 万 TCP 连接之外还要容纳监听、HTTP/RPC 和日志文件描述符。
    ulimits:
      nofile:
        soft: 200000
        hard: 200000

    # 8 核 16 GiB 专用主机为内核、Docker、Socket 和文件缓存预留约 3 GiB。
    mem_limit: "${DEVICE_SOCKET_MEMORY_LIMIT:-13g}"
    # 与内存上限相同表示不允许额外使用 Swap，避免长连接 Gateway 出现不可控延迟。
    memswap_limit: "${DEVICE_SOCKET_MEMORY_SWAP_LIMIT:-13g}"

    environment:
      # 镜像内已经启用 Server GC，此处显式保留便于运维检查。
      DOTNET_gcServer: "1"
      ASPNETCORE_ENVIRONMENT: Production
      TZ: "${DEVICE_SOCKET_TIME_ZONE:-Asia/Shanghai}"

    volumes:
      # 应用参数统一由宿主机 appsettings.json 管理，避免再被 Compose 环境变量隐式覆盖。
      - type: bind
        source: "${DEVICE_SOCKET_CONFIG_DIR:-/data/config/devicesocket}/appsettings.json"
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
      # Serilog 独立配置支持按设备调整心跳日志和文件保留策略。
      - type: bind
        source: "${DEVICE_SOCKET_CONFIG_DIR:-/data/config/devicesocket}/serilog.json"
        target: /app/Configuration/Logging/serilog.json
        read_only: true
        bind:
          create_host_path: false
      # 日志目录必须预先授权给镜像内 UID/GID 1654；禁止由 Docker 自动创建 root 目录。
      - type: bind
        source: "${DEVICE_SOCKET_LOG_DIR:-/data/logs/devicesocket}"
        target: /app/logs
        bind:
          create_host_path: false

    # 除日志挂载和 /tmp 外保持镜像只读，减少容器被入侵后的持久化写入面。
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # 应用程序日志也会输出少量控制台信息，限制 Docker 自身日志避免重复占满磁盘。
    logging:
      driver: local
      options:
        max-size: 20m
        max-file: "3"
